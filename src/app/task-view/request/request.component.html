
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>

  <div class="wrapper" id="animation" style="background-color: #2e3143a2;backdrop-filter: blur(2px); ">
    
    <mat-card class="col-12 row" style="width: 100%;border: 1px solid #666871; background: white; text-align: center; width: 70vw; min-height: 90vh !important;text-align: -webkit-center;">
      <div class="center">
        <h3 style="color: black;">Users</h3>
      </div>

      <div class="col-12 row center" style="align-items: self-end;">
      <div class="col-6">
      <form [formGroup]="form">
      <mat-form-field formControlName="task" class="col-12" appearance="fill">
        <mat-label class="textinputlabel" >Task Interest:</mat-label> 
        <mat-select  (selectionChange)="taskInputChanged($event)">
            <mat-option *ngFor="let option of taskNameListNamesOnly" [value]="option">   
          {{option}} 
            </mat-option>
          </mat-select> 
          </mat-form-field>
        </form>
        </div>

      <div class="col-5" style="text-align: right; float:right;">     
        <mat-form-field appearance="outline" > 
          <mat-label style="color: black; padding-left: 4px;">Filter</mat-label>
          <input style="color: black; padding-left: 4px;" matInput (keyup)="applyFilter($event.target.value)" placeholder="Ex. Ben" #input> 
          <mat-icon style="font-size:x-large;" matSuffix>search</mat-icon>
        </mat-form-field> 
      </div>
    </div>
  
  
          <div class="table-container mat-elevation-z4" style="background: #f5f5f5;padding: 30px;border-radius: 10px;width: 90%; max-height: 80vh !important;">
  
              <table *ngIf="matTableDataSource" mat-table [dataSource]="matTableDataSource" matSort>
      
                <ng-container  matColumnDef="username">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                  <td  mat-cell *matCellDef="let element" class="colourHover">
                    {{element.firstName}} {{element.lastName}}
                  </td>
                </ng-container>
      
                <ng-container  matColumnDef="email">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                  <td  mat-cell *matCellDef="let element" class="colourHover">
                      {{element.email}}
                  </td>
                </ng-container>
      
                <ng-container  matColumnDef="profile">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Profile</th>
                  <td  mat-cell *matCellDef="let element" class="colourHover">
                      <mat-icon (click)="openProfile(element)">account_box</mat-icon>
                  </td>
                </ng-container>
      
                <ng-container  matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Actions</th>
                  <td  mat-cell *matCellDef="let element" class="colourHover">
                    <button  (click)=sendRequest(element) class="btn" > Send Request </button>
                  </td>
                </ng-container>
      
                <tr mat-header-row *matHeaderRowDef="matTableColumnDisplay"></tr>
                <tr mat-row *matRowDef="let row; columns: matTableColumnDisplay;"></tr>
              </table>
      
              <mat-paginator [pageSizeOptions]="[10,15,20]" showFirstLastButtons></mat-paginator>
              </div>
              
         
     
              <div class="col-12" style="visibility: hidden;">
                <button   mat-raised-button class="col-2" style="margin-top: 25px; background-color: rgb(230, 230, 230);">Back</button>
              </div>

      <div class="col-12" style="position: absolute;bottom: 3%;">
        <button  class="col-2" mat-raised-button (click)="close()"  style="margin-top: 15px; background-color: rgb(230, 230, 230);">Back</button>
      </div>

    </mat-card>
    

  </div>
